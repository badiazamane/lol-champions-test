<mat-toolbar color="primary" class="mat-elevation-z6">
  <span>LoL Champions Manager</span>
</mat-toolbar>

<div class="container" style="padding: 20px">
  <div style="margin-bottom: 15px">
    <button mat-raised-button color="accent" (click)="resetFilters()">
      Réinitialiser la liste
    </button>
    <span style="margin-left: 20px; font-style: italic; color: gray">
      Total : {{ rowData.length }} champions chargés
    </span>
  </div>

  <div class="ag-theme-alpine" style="height: 600px; width: 100%">
    <ag-grid-angular
      style="width: 100%; height: 100%"
      [columnDefs]="columnDefs"
      [rowData]="rowData"
      [pagination]="true"
      [paginationPageSize]="20"
      [theme]="'legacy'"
    >
    </ag-grid-angular>
  </div>
</div>
